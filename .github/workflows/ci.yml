name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  render:
    name: Render example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub-hosted Ubuntu runners ship with Google Chrome, which shotforge uses by default.
      - name: Render the Lumen example
        working-directory: examples/lumen
        run: node ../../dist/cli.js render --targets ios-6.9,android-phone --locales en
      - uses: actions/upload-artifact@v7
        with:
          name: lumen-screenshots
          path: examples/lumen/out
          retention-days: 7
