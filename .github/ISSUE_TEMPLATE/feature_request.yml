name: Feature request
description: Suggest a theme, layout, command or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the store listing you want to make.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links or images of store listings that inspired the idea.
